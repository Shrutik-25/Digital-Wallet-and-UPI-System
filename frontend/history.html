<!DOCTYPE html>
<html>
<head>
<title>History</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div class="app">

<div class="sidebar">
    <div class="logo">
        <span class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 8.5C4 6.567 5.567 5 7.5 5h9C18.433 5 20 6.567 20 8.5v7c0 1.933-1.567 3.5-3.5 3.5h-9C5.567 19 4 17.433 4 15.5v-7Z" stroke="currentColor" stroke-width="1.7"/>
                <path d="M4 9h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                <circle cx="16.5" cy="14" r="1.3" fill="currentColor"/>
            </svg>
        </span>
        <div class="logo-copy">
            <strong>UPI<span class="blue">Wallet</span></strong>
            <small>Premium Digital Wallet</small>
        </div>
    </div>

    <ul>
        <li onclick="goDashboard()">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1v-8.5Z" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <span>Dashboard</span>
        </li>
        <li onclick="goSend()">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="m5 12 13-7-3 14-4-5-6-2Z" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <span>Send</span>
        </li>
        <li onclick="goRequest()">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 5v14M5 12h14" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span>Request</span>
        </li>
        <li class="active">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 8v4l3 3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M20 12a8 8 0 1 1-2.343-5.657" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span>History</span>
        </li>
        <li onclick="goProfile()">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" stroke-width="1.8"/>
                <path d="M5 20a7 7 0 0 1 14 0" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span>Profile</span>
        </li>
    </ul>
</div>

<div class="main">

<div class="topbar">
    <div class="topbar-copy">
        <p class="eyebrow">Activity</p>
        <h2>Transaction History</h2>
        <p>All your wallet movements in one place</p>
    </div>
    <div class="user">
        <div class="avatar" id="avatar">U</div>
        <div class="user-meta">
            <div id="usernameText"></div>
            <small id="upiText"></small>
        </div>
        <button onclick="logout()">Logout</button>
    </div>
</div>

<div class="history-card history-page-card">
    <span class="floating-bubble bubble-history" aria-hidden="true"></span>

    <div class="history-header">
        <div class="section-heading">
            <span class="section-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 8v4l3 3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M20 12a8 8 0 1 1-2.343-5.657" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </span>
            <div>
                <h3>All Transactions</h3>
                <p>Chronological payment history</p>
            </div>
        </div>
    </div>

    <div id="historyContainer">
        <div class="empty" id="emptyState">
            <div class="icon">📭</div>
            <p>No transactions yet</p>
        </div>

        <ul id="historyList"></ul>
    </div>
</div>

</div>
</div>

<script src="script.js"></script>
</body>
</html>
